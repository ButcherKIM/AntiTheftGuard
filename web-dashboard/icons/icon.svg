<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="12" />

  <!-- Shield Shape -->
  <path d="M 256 95 L 395 125 L 395 270 C 395 345 325 405 256 425 C 187 405 117 345 117 270 L 117 125 Z"
        fill="url(#shieldGrad)" stroke="#60a5fa" stroke-width="10" />

  <!-- Radar / Crosshair circles -->
  <circle cx="256" cy="255" r="75" fill="none" stroke="#93c5fd" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="8 6" />
  
  <!-- GPS Beacon Core -->
  <circle cx="256" cy="255" r="42" fill="#ef4444" stroke="#ffffff" stroke-width="8" filter="url(#glow)" />
  <circle cx="256" cy="255" r="16" fill="#ffffff" />
</svg>
