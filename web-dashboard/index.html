<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AntiTheft Guard - 호스트 웹 대시보드</title>
  
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-panel: #1e293b;
      --bg-card: #273549;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --warning: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Navigation */
    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand i {
      color: var(--primary);
      font-size: 1.5rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 9999px;
      background: #064e3b;
      color: #34d399;
      font-weight: 600;
      transition: all 0.3s;
    }

    .status-badge.disconnected {
      background: #7f1d1d;
      color: #f87171;
    }

    .status-badge.connecting {
      background: #1e3a8a;
      color: #93c5fd;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* Main Container */
    main {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
      position: relative;
    }

    /* Map Section */
    #map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #111827;
    }

    /* Map Overlay Controls */
    .map-controls {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 900;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .map-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      transition: all 0.2s;
    }

    .map-btn:hover {
      background: var(--bg-card);
      border-color: var(--primary);
    }

    /* Right Dashboard Sidebar */
    .sidebar {
      width: 440px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 950;
    }

    .sidebar-section {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Device Selector Box */
    .device-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input, select {
      flex: 1;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    /* Telemetry Grid */
    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .telemetry-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .telemetry-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .telemetry-val {
      font-size: 1.1rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Progress Bar */
    .progress-bar {
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Live Video Monitor */
    .video-monitor {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      height: 240px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-placeholder {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .video-placeholder i {
      font-size: 2.5rem;
      opacity: 0.5;
    }

    .live-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--danger);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      display: none;
      align-items: center;
      gap: 6px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .stream-timer {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      display: none;
    }

    /* Action Buttons */
    .btn-action-primary {
      background: var(--danger);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
    }

    .btn-action-primary:hover {
      background: var(--danger-hover);
    }

    .btn-action-primary:active {
      transform: scale(0.98);
    }

    .btn-action-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      width: 100%;
    }

    .btn-action-secondary:hover {
      background: #334155;
    }

    /* Pulse beacon for phone marker */
    .beacon-marker {
      position: relative;
    }
    .beacon-dot {
      width: 18px;
      height: 18px;
      background: #ef4444;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 16px 4px #ef4444;
    }
    .beacon-ring {
      position: absolute;
      top: -9px;
      left: -9px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #ef4444;
      animation: beacon-wave 2s infinite ease-out;
      pointer-events: none;
    }
    @keyframes beacon-wave {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 900px) {
      body {
        height: auto;
        overflow: auto;
      }
      main {
        flex-direction: column;
        height: auto;
      }
      #map-container {
        height: 480px;
      }
      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-shield-halved"></i>
      <span>AntiTheft Guard <span style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted);">HOST WEB</span></span>
    </div>
    <div class="header-actions">
      <div id="firebase-status" class="status-badge connecting">
        <span class="status-dot"></span>
        <span id="firebase-status-text">기기 검색 중...</span>
      </div>
    </div>
  </header>

  <!-- Main Body -->
  <main>
    <!-- Map Section -->
    <div id="map-container">
      <div id="map"></div>
      <div class="map-controls">
        <button class="map-btn" id="btn-recenter"><i class="fa-solid fa-crosshairs"></i> 내 폰 위치로 이동</button>
        <button class="map-btn" id="btn-clear-trail"><i class="fa-solid fa-route"></i> 궤적 지우기</button>
        <button class="map-btn" id="btn-refresh"><i class="fa-solid fa-rotate"></i> 즉시 새로고침</button>
      </div>
    </div>

    <!-- Sidebar Section -->
    <div class="sidebar">
      
      <!-- Device Selector -->
      <div class="sidebar-section">
        <div class="section-title"><i class="fa-solid fa-mobile-screen"></i> 추적 기기 선택</div>
        <div class="device-box">
          <div class="input-group">
            <input type="text" id="target-device-id" placeholder="기기 ID (예: phone_sm-x526n)" />
            <button class="map-btn" id="btn-connect-device"><i class="fa-solid fa-link"></i> 연결</button>
          </div>
          <div id="device-state-tag" style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.4;">
            기기 검색 및 실시간 상태 동기화 중...
          </div>
        </div>
      </div>

      <!-- Telemetry Info -->
      <div class="sidebar-section">
        <div class="section-title"><i class="fa-solid fa-gauge-high"></i> 실시간 상태 정보</div>
        <div class="telemetry-grid">
          
          <div class="telemetry-card">
            <div class="telemetry-label"><i class="fa-solid fa-battery-half"></i> 배터리 잔량</div>
            <div class="telemetry-val" id="val-battery">--%</div>
            <div class="progress-bar">
              <div class="progress-fill" id="val-battery-bar"></div>
            </div>
          </div>

          <div class="telemetry-card">
            <div class="telemetry-label"><i class="fa-solid fa-gauge"></i> 이동 속도</div>
            <div class="telemetry-val" id="val-speed">0.0 km/h</div>
          </div>

          <div class="telemetry-card">
            <div class="telemetry-label"><i class="fa-solid fa-bullseye"></i> GPS 정밀도</div>
            <div class="telemetry-val" id="val-accuracy">-- m</div>
          </div>

          <div class="telemetry-card">
            <div class="telemetry-label"><i class="fa-solid fa-clock"></i> 마지막 수신</div>
            <div class="telemetry-val" id="val-last-seen" style="font-size: 0.95rem;">--</div>
          </div>

        </div>
      </div>

      <!-- Live WebRTC Camera Stream Monitor -->
      <div class="sidebar-section">
        <div class="section-title"><i class="fa-solid fa-video"></i> 실시간 영상 및 오디오</div>
        <div class="video-monitor">
          
          <div class="video-wrapper">
            <video id="remote-video" autoplay playsinline></video>
            
            <div class="video-placeholder" id="video-placeholder">
              <i class="fa-solid fa-camera-rotate"></i>
              <span>스트리밍 대기 중</span>
            </div>

            <div class="live-badge" id="live-badge">
              <i class="fa-solid fa-circle"></i> LIVE
            </div>

            <div class="stream-timer" id="stream-timer">03:00</div>
          </div>

          <!-- Action Buttons -->
          <button class="btn-action-primary" id="btn-start-stream">
            <i class="fa-solid fa-tower-broadcast"></i> 3분간 실시간 스트리밍 요청
          </button>

          <button class="btn-action-secondary" id="btn-record-stream" style="display: none;">
            <i class="fa-solid fa-record-vinyl" style="color: var(--danger);"></i> 증거 영상 녹화 및 다운로드
          </button>

          <button class="btn-action-secondary" id="btn-stop-stream" style="display: none;">
            <i class="fa-solid fa-stop"></i> 스트리밍 중지
          </button>

        </div>
      </div>

    </div>
  </main>

  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- 1. Firestore REST API Configuration ---
    // Direct, ultra-fast, zero-dependency REST access (no WebSockets/Auth errors)
    const PROJECT_ID = "antitheftguard-cadb1";
    const REST_BASE = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

    const statusBadge = document.getElementById('firebase-status');
    const statusText = document.getElementById('firebase-status-text');

    function setOnlineStatus(online, message) {
      if (online) {
        statusBadge.className = 'status-badge';
        statusText.innerText = message || 'Firebase 정상 연결됨';
      } else {
        statusBadge.className = 'status-badge disconnected';
        statusText.innerText = message || '연결 실패';
      }
    }

    // Helper: Parse Firestore REST field format into plain JS objects
    function parseFirestoreValue(val) {
      if (!val) return null;
      if ('stringValue' in val) return val.stringValue;
      if ('integerValue' in val) return parseInt(val.integerValue, 10);
      if ('doubleValue' in val) return parseFloat(val.doubleValue);
      if ('booleanValue' in val) return val.booleanValue;
      if ('timestampValue' in val) return val.timestampValue;
      if ('mapValue' in val) {
        const res = {};
        const fields = (val.mapValue && val.mapValue.fields) || {};
        for (const k in fields) {
          res[k] = parseFirestoreValue(fields[k]);
        }
        return res;
      }
      if ('arrayValue' in val) {
        const list = (val.arrayValue && val.arrayValue.values) || [];
        return list.map(parseFirestoreValue);
      }
      return null;
    }

    function parseFirestoreDoc(doc) {
      if (!doc || !doc.fields) return null;
      const result = { _name: doc.name };
      for (const key in doc.fields) {
        result[key] = parseFirestoreValue(doc.fields[key]);
      }
      return result;
    }

    // --- 2. Leaflet Map Setup ---
    const map = L.map('map', {
      zoomControl: true,
      attributionControl: false
    }).setView([37.5665, 126.9780], 14); // 서울 기본 좌표 (기기 연결 시 자동 이동)

    // Standard OpenStreetMap Tiles (100% Free, Global, No API Key Required)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let phoneMarker = null;
    let accuracyCircle = null;
    let polyline = L.polyline([], { color: '#3b82f6', weight: 4, opacity: 0.85 }).addTo(map);
    let pathCoordinates = [];
    let hasAutoCentered = false;

    // Custom Glowing Beacon Icon for target phone
    const phoneIcon = L.divIcon({
      className: 'beacon-marker',
      html: `
        <div class="beacon-ring"></div>
        <div class="beacon-dot"></div>
      `,
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    function updateMapLocation(lat, lng, accuracy) {
      const latlng = [lat, lng];

      if (!phoneMarker) {
        phoneMarker = L.marker(latlng, { icon: phoneIcon }).addTo(map);
        accuracyCircle = L.circle(latlng, {
          radius: accuracy || 15,
          color: '#3b82f6',
          fillColor: '#3b82f6',
          fillOpacity: 0.18,
          weight: 1
        }).addTo(map);
        map.setView(latlng, 17);
        hasAutoCentered = true;
      } else {
        phoneMarker.setLatLng(latlng);
        accuracyCircle.setLatLng(latlng);
        if (accuracy) accuracyCircle.setRadius(accuracy);

        if (!hasAutoCentered) {
          map.setView(latlng, 17);
          hasAutoCentered = true;
        }
      }
    }

    document.getElementById('btn-recenter').addEventListener('click', () => {
      if (phoneMarker) {
        map.setView(phoneMarker.getLatLng(), 17);
      } else {
        alert("아직 수신된 위치 정보가 없습니다.");
      }
    });

    document.getElementById('btn-clear-trail').addEventListener('click', () => {
      pathCoordinates = [];
      polyline.setLatLngs([]);
    });

    document.getElementById('btn-refresh').addEventListener('click', () => {
      if (currentDeviceId) {
        syncDeviceData(currentDeviceId);
      } else {
        loadAvailableDevices();
      }
    });

    // --- 3. Telemetry & Device Observer (REST API Auto-Polling) ---
    let currentDeviceId = "";
    let syncIntervalId = null;

    async function loadAvailableDevices() {
      try {
        statusBadge.className = 'status-badge connecting';
        statusText.innerText = "기기 목록 조회 중...";

        const res = await fetch(`${REST_BASE}/devices`);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const docs = data.documents || [];

        if (docs.length > 0) {
          const parsedDevices = docs.map(parseFirestoreDoc).filter(Boolean);
          
          // URL 파라미터 ?device= 가 있으면 우선 사용, 없으면 첫 번째 기기 자동 선택
          const urlParams = new URLSearchParams(window.location.search);
          const targetParam = urlParams.get('device');
          const selected = parsedDevices.find(d => d.deviceId === targetParam) || parsedDevices[0];

          document.getElementById('target-device-id').value = selected.deviceId;
          setOnlineStatus(true, "Firebase 정상 연결됨");
          connectDevice(selected.deviceId);
        } else {
          setOnlineStatus(true, "기기 대기 중 (기록 없음)");
          document.getElementById('device-state-tag').innerHTML = 
            `등록된 기기가 없습니다. 앱에서 [🚨 GPS 도난 방지 추적 시작] 버튼을 눌러주세요.`;
        }
      } catch (err) {
        console.error("Device fetch error:", err);
        setOnlineStatus(false, "DB 접근 오류");
        document.getElementById('device-state-tag').innerHTML = 
          `<span style="color: #f87171">⚠️ 기기 목록을 가져오지 못했습니다: ${err.message}</span>`;
      }
    }

    document.getElementById('btn-connect-device').addEventListener('click', () => {
      const devId = document.getElementById('target-device-id').value.trim();
      if (devId) connectDevice(devId);
    });

    document.getElementById('target-device-id').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const devId = document.getElementById('target-device-id').value.trim();
        if (devId) connectDevice(devId);
      }
    });

    function connectDevice(deviceId) {
      currentDeviceId = deviceId;
      hasAutoCentered = false;
      pathCoordinates = [];
      polyline.setLatLngs([]);

      if (syncIntervalId) clearInterval(syncIntervalId);

      document.getElementById('device-state-tag').innerHTML = 
        `추적 대상: <strong style="color: #60a5fa">${deviceId}</strong> (데이터 수신 중...)`;

      // 즉시 동기화 실행 후 3초마다 지속적 실시간 폴링
      syncDeviceData(deviceId);
      syncIntervalId = setInterval(() => {
        syncDeviceData(deviceId);
      }, 3000);
    }

    // 실시간 수신 시간 포맷팅 함수 (초 단위 경과 시간 표시)
    let lastRecordedTimestamp = 0;
    function formatLastSeen(ts) {
      if (!ts) return "--";
      const date = new Date(ts);
      const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));

      if (diffSec < 10) return `${timeStr} (방금 전)`;
      if (diffSec < 60) return `${timeStr} (${diffSec}초 전)`;
      if (diffSec < 3600) return `${timeStr} (${Math.floor(diffSec / 60)}분 전)`;
      return `${timeStr} (${Math.floor(diffSec / 3600)}시간 전)`;
    }

    // 1초마다 '방금 전 / N초 전' 상대 시간을 부드럽게 갱신
    setInterval(() => {
      if (lastRecordedTimestamp > 0) {
        document.getElementById('val-last-seen').innerText = formatLastSeen(lastRecordedTimestamp);
      }
    }, 1000);

    async function syncDeviceData(deviceId) {
      try {
        let deviceName = "";
        let bestBattery = null;
        let newestTimestamp = 0;

        // 1) 기기 메타데이터 조회
        try {
          const devRes = await fetch(`${REST_BASE}/devices/${deviceId}`);
          if (devRes.ok) {
            const devDoc = await devRes.json();
            const devData = parseFirestoreDoc(devDoc);
            if (devData) {
              if (devData.deviceName) deviceName = devData.deviceName;
              if (devData.batteryLevel !== undefined) bestBattery = devData.batteryLevel;
              if (devData.lastSeen) newestTimestamp = Math.max(newestTimestamp, devData.lastSeen);
            }
          }
        } catch (e) {
          console.warn("Device metadata fetch error:", e);
        }

        // 2) GPS 궤적 및 최근 위치 수신 (runQuery로 최신 배치 50개 역순 조회)
        let batches = [];
        try {
          const queryRes = await fetch(`${REST_BASE}/devices/${deviceId}:runQuery`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              structuredQuery: {
                from: [{ collectionId: 'gps_batches' }],
                orderBy: [{ field: { fieldPath: 'startTime' }, direction: 'DESCENDING' }],
                limit: 50
              }
            })
          });

          if (queryRes.ok) {
            const queryData = await queryRes.json();
            batches = queryData
              .filter(item => item.document)
              .map(item => parseFirestoreDoc(item.document));
          }
        } catch (queryErr) {
          console.warn("runQuery failed, falling back to direct list:", queryErr);
        }

        // fallback to direct subcollection list if runQuery is empty
        if (batches.length === 0) {
          try {
            const listRes = await fetch(`${REST_BASE}/devices/${deviceId}/gps_batches?pageSize=50`);
            if (listRes.ok) {
              const listData = await listRes.json();
              batches = (listData.documents || []).map(parseFirestoreDoc);
            }
          } catch (listErr) {
            console.warn("Batch list error:", listErr);
          }
        }

        // 3) GPS 포인트 취합
        const allPoints = [];
        batches.forEach(batch => {
          if (batch) {
            if (batch.endTime) newestTimestamp = Math.max(newestTimestamp, batch.endTime);
            if (batch.startTime) newestTimestamp = Math.max(newestTimestamp, batch.startTime);

            if (Array.isArray(batch.points)) {
              batch.points.forEach(pt => {
                if (pt && typeof pt.latitude === 'number' && typeof pt.longitude === 'number') {
                  allPoints.push(pt);
                }
              });
            }
          }
        });

        // 4) UI 일괄 업데이트 (값 덮어쓰기 깜빡임 방지)
        if (allPoints.length > 0) {
          // 시간순 정렬 (과거 -> 최신)
          allPoints.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

          // 맵 궤적 업데이트
          pathCoordinates = allPoints.map(pt => [pt.latitude, pt.longitude]);
          polyline.setLatLngs(pathCoordinates);

          // 가장 최신 위치
          const latest = allPoints[allPoints.length - 1];
          updateMapLocation(latest.latitude, latest.longitude, latest.accuracy);

          document.getElementById('val-speed').innerText = `${((latest.speed || 0) * 3.6).toFixed(1)} km/h`;
          document.getElementById('val-accuracy').innerText = `±${Math.round(latest.accuracy || 0)} m`;

          if (latest.batteryLevel !== undefined) {
            bestBattery = latest.batteryLevel;
          }
          if (latest.timestamp) {
            newestTimestamp = Math.max(newestTimestamp, latest.timestamp);
          }

          setOnlineStatus(true, "실시간 수신 중 🟢");
          const devLabel = deviceName ? ` (${deviceName})` : "";
          document.getElementById('device-state-tag').innerHTML = 
            `추적 대상: <strong style="color: #60a5fa">${deviceId}</strong>${devLabel} · <strong>총 ${allPoints.length}개</strong> 궤적 수신 중 📍`;
        } else {
          const devLabel = deviceName ? ` (${deviceName})` : "";
          document.getElementById('device-state-tag').innerHTML = 
            `추적 대상: <strong style="color: #60a5fa">${deviceId}</strong>${devLabel} · GPS 데이터 대기 중...`;
        }

        // 배터리 및 마지막 수신 시간 단일 업데이트
        if (bestBattery !== null) {
          document.getElementById('val-battery').innerText = `${bestBattery}%`;
          document.getElementById('val-battery-bar').style.width = `${bestBattery}%`;
        }

        if (newestTimestamp > 0) {
          lastRecordedTimestamp = newestTimestamp;
          document.getElementById('val-last-seen').innerText = formatLastSeen(newestTimestamp);
        }
      } catch (err) {
        console.error("Sync error:", err);
      }
    }

    // --- 4. WebRTC Video / Audio Streaming Control ---
    let peerConnection = null;
    let streamCountdown = null;
    let mediaRecorder = null;
    let recordedChunks = [];

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    const btnStart = document.getElementById('btn-start-stream');
    const btnStop = document.getElementById('btn-stop-stream');
    const btnRecord = document.getElementById('btn-record-stream');
    const remoteVideo = document.getElementById('remote-video');
    const placeholder = document.getElementById('video-placeholder');
    const liveBadge = document.getElementById('live-badge');
    const timerElem = document.getElementById('stream-timer');

    btnStart.addEventListener('click', async () => {
      if (!currentDeviceId) {
        alert("기기 ID를 먼저 입력하거나 선택해주세요!");
        return;
      }
      startRemoteStream(currentDeviceId);
    });

    btnStop.addEventListener('click', () => {
      stopRemoteStream();
    });

    async function startRemoteStream(deviceId) {
      btnStart.disabled = true;
      btnStart.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 연결 요청 신호 전송 중...`;

      const roomId = "room_" + Date.now();

      try {
        // Send request to Firestore signaling subcollection
        await fetch(`${REST_BASE}/devices/${deviceId}/signaling/${roomId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fields: {
              request: { stringValue: "START_STREAM" },
              createdAt: { integerValue: String(Date.now()) }
            }
          })
        });

        alert(`기기(${deviceId})로 실시간 스트리밍 시작 신호를 전달했습니다!\n원격 카메라가 활성화되면 화면이 표시됩니다.`);
        btnStart.style.display = 'none';
        btnStop.style.display = 'flex';
        btnRecord.style.display = 'flex';
        liveBadge.style.display = 'flex';
        timerElem.style.display = 'block';
        startStreamTimer(180); // 3 minutes
      } catch (e) {
        console.error("Signaling error:", e);
        alert("스트리밍 요청 전송 실패: " + e.message);
        btnStart.disabled = false;
        btnStart.innerHTML = `<i class="fa-solid fa-tower-broadcast"></i> 3분간 실시간 스트리밍 요청`;
      }
    }

    function startStreamTimer(seconds) {
      let remaining = seconds;
      clearInterval(streamCountdown);
      streamCountdown = setInterval(() => {
        remaining--;
        const m = String(Math.floor(remaining / 60)).padStart(2, '0');
        const s = String(remaining % 60).padStart(2, '0');
        timerElem.innerText = `${m}:${s}`;
        if (remaining <= 0) {
          stopRemoteStream();
        }
      }, 1000);
    }

    function stopRemoteStream() {
      clearInterval(streamCountdown);
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      remoteVideo.srcObject = null;
      placeholder.style.display = 'flex';
      liveBadge.style.display = 'none';
      timerElem.style.display = 'none';
      btnStart.style.display = 'flex';
      btnStart.disabled = false;
      btnStart.innerHTML = `<i class="fa-solid fa-tower-broadcast"></i> 3분간 실시간 스트리밍 요청`;
      btnStop.style.display = 'none';
      btnRecord.style.display = 'none';
    }

    // --- 5. Stream Recording & Download ---
    btnRecord.addEventListener('click', () => {
      const stream = remoteVideo.srcObject;
      if (!stream) {
        alert("활성화된 실시간 영상 스트림이 없습니다.");
        return;
      }

      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = `AntiTheft_Evidence_${Date.now()}.webm`;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
          }, 100);
        };
        mediaRecorder.start();
        btnRecord.innerHTML = `<i class="fa-solid fa-stop" style="color: var(--danger);"></i> 녹화 중지 및 파일 저장`;
      } else {
        mediaRecorder.stop();
        btnRecord.innerHTML = `<i class="fa-solid fa-record-vinyl" style="color: var(--danger);"></i> 증거 영상 녹화 및 다운로드`;
      }
    });

    // Start loading immediately on DOM load
    window.addEventListener('DOMContentLoaded', () => {
      loadAvailableDevices();
    });
  </script>
</body>
</html>
