[versions]
agp = "8.2.2"
kotlin = "1.9.22"
coreKtx = "1.12.0"
appcompat = "1.6.1"
material = "1.11.0"
constraintlayout = "2.1.4"
lifecycle = "2.7.0"
navigation = "2.7.7"
firebaseBom = "32.7.2"
webrtc = "1.1.1"
camerax = "1.3.1"
playServicesLocation = "21.1.0"
playServicesAuth = "21.0.0"
room = "2.6.1"
workManager = "2.9.0"
mlkitBarcode = "17.2.0"
zxing = "3.5.3"
